/* Movimiento: todo lo que se oculta o aparece con la propiedad "hidden" entra y sale con animación */
(function () {
  window.whenGone = el => new Promise(res => {
    const a = el && el.__lv; if (!a) return res();
    a.addEventListener('finish', () => res()); a.addEventListener('cancel', () => res());
  });
  const d = Object.getOwnPropertyDescriptor(HTMLElement.prototype, 'hidden');
  if (!d || !d.set || !Element.prototype.animate) return;
  const mq = matchMedia('(prefers-reduced-motion: reduce)');
  const KINDS = [['.pp-menu', 'pop'], ['.namef', 'form'], ['#sexStep,#testBody,#back', 'fade'], ['.live,.hist,.gsum,#contRow,.notice,.explain,#songName', 'collapse']];
  const kindOf = el => { for (const [s, k] of KINDS) if (el.matches(s)) return k; return null; };
  const shown = el => el.getClientRects().length > 0;
  const OUT = 'cubic-bezier(.22,1,.36,1)', IO = 'cubic-bezier(.4,0,.2,1)';
  const BOX = ['marginTop', 'marginBottom', 'paddingTop', 'paddingBottom', 'borderTopWidth', 'borderBottomWidth'];
  function run(el, kind, leaving) {
    let A, B, opt;
    if (kind === 'collapse') {
      const cs = getComputedStyle(el);
      A = { opacity: 1, height: el.getBoundingClientRect().height + 'px' }; B = { opacity: 0, height: '0px' };
      BOX.forEach(p => { A[p] = cs[p]; B[p] = '0px'; });
      opt = leaving ? { duration: 280, easing: IO } : { duration: 460, easing: OUT };
    } else if (kind === 'pop') {
      el.style.transformOrigin = 'bottom right';
      A = { opacity: 1, transform: 'none' }; B = { opacity: 0, transform: 'translateY(8px) scale(.94)' };
      opt = leaving ? { duration: 170, easing: IO } : { duration: 280, easing: OUT };
    } else if (kind === 'form') {
      A = { opacity: 1, transform: 'none' }; B = { opacity: 0, transform: 'scaleX(.55)' };
      opt = { duration: 220, easing: IO };
    } else {
      A = { opacity: 1, transform: 'none' }; B = { opacity: 0, transform: leaving ? 'translateY(-8px)' : 'translateY(12px)' };
      opt = leaving ? { duration: 240, easing: IO } : { duration: 420, easing: OUT };
    }
    const ov = el.style.overflow;
    if (kind === 'collapse') el.style.overflow = 'hidden';
    const an = el.animate(leaving ? [A, B] : [B, A], opt);
    const rst = () => { if (kind === 'collapse') el.style.overflow = ov; };
    an.addEventListener('finish', rst); an.addEventListener('cancel', rst);
    return an;
  }
  Object.defineProperty(HTMLElement.prototype, 'hidden', {
    configurable: true, enumerable: d.enumerable,
    get() { return this.__lv ? true : d.get.call(this); },
    set(v) {
      v = !!v;
      const kind = kindOf(this);
      if (!kind || mq.matches) return d.set.call(this, v);
      if (this.__lv) { if (!v) { const a = this.__lv; this.__lv = null; a.cancel(); } return; }
      if (v === d.get.call(this)) return;
      if (v) {
        if (!shown(this)) return d.set.call(this, true);
        const an = run(this, kind, true); this.__lv = an;
        an.onfinish = () => { if (this.__lv === an) { this.__lv = null; d.set.call(this, true); } };
        return;
      }
      d.set.call(this, false);
      if (kind === 'form') return;   // la entrada de este la hace el CSS
      queueMicrotask(() => { if (d.get.call(this) || this.__lv || !shown(this)) return; run(this, kind, false); });
    }
  });
})();

<script>
/*CORE-START*/
const NOTE_ES = ['Do','Do♯','Re','Re♯','Mi','Fa','Fa♯','Sol','Sol♯','La','La♯','Si'];
const NOTE_EN = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const hzToMidi = f => 69 + 12 * Math.log2(f / 440);
const midiToHz = m => 440 * Math.pow(2, (m - 69) / 12);
function noteInfo(m) {
  const r = Math.round(m), cents = Math.round((m - r) * 100), pc = ((r % 12) + 12) % 12, oct = Math.floor(r / 12) - 1;
  return { midi: r, cents, es: NOTE_ES[pc] + oct, en: NOTE_EN[pc] + oct, hz: midiToHz(m) };
}
const pct = (a, p) => {
  const s = [...a].sort((x, y) => x - y), i = (s.length - 1) * p, lo = Math.floor(i), hi = Math.ceil(i);
  return s[lo] + (s[hi] - s[lo]) * (i - lo);
};

// ---- Motor de tono v2 ----
// Cuatro bandas de análisis, cada una con su propia frecuencia de muestreo y una ventana de al menos 3 periodos
// de su tono más grave (regla de Praat). En cada cuadro se recogen candidatos YIN de todas las bandas y un
// Viterbi (como Praat y pYIN) elige el camino más coherente entre cuadros. Después se afina el periodo con
// interpolación fraccional y, en notas sostenidas, se verifica la octava con el espectro.
const FMIN_ABS = 16, FMAX_ABS = 9000;          // Do0 ≈ 16.35 Hz hasta ~Do9
const BANDS = [
  { id: 'low',  lo: 16,   hi: 110,  sr: 2900 },
  { id: 'mid',  lo: 70,   hi: 700,  sr: 11000 },
  { id: 'high', lo: 450,  hi: 2300, sr: 22050 },
  { id: 'whis', lo: 1500, hi: 9000, sr: 1e9 }   // frecuencia de muestreo original
];
const OCT_COST = 0.05;

function highpass(x, sr, fc) {
  const w0 = 2 * Math.PI * fc / sr, cs = Math.cos(w0), al = Math.sin(w0) / (2 * Math.SQRT1_2);
  const b0 = (1 + cs) / 2, b1 = -(1 + cs), a0 = 1 + al, a1 = -2 * cs, a2 = 1 - al;
  const y = new Float32Array(x.length); let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
  for (let i = 0; i < x.length; i++) {
    const v = (b0 * x[i] + b1 * x1 + b0 * x2 - a1 * y1 - a2 * y2) / a0;
    y[i] = v; x2 = x1; x1 = x[i]; y2 = y1; y1 = v;
  }
  return y;
}

// Filtro paso bajo (sinc con ventana Blackman) y diezmado, sin desfase.
function lowpassDecimate(x, sr, target) {
  const f = Math.max(1, Math.floor(sr / target));
  if (f === 1) return { x, sr };
  const half = 10 * f, taps = 2 * half + 1, h = new Float64Array(taps), fc = 0.45 / f;
  let sum = 0;
  for (let k = 0; k < taps; k++) {
    const n = k - half, sinc = n === 0 ? 2 * fc : Math.sin(2 * Math.PI * fc * n) / (Math.PI * n);
    h[k] = sinc * (0.42 - 0.5 * Math.cos(2 * Math.PI * k / (taps - 1)) + 0.08 * Math.cos(4 * Math.PI * k / (taps - 1)));
    sum += h[k];
  }
  for (let k = 0; k < taps; k++) h[k] /= sum;
  const n = Math.floor(x.length / f), y = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const c = i * f - half; let s = 0;
    if (c >= 0 && c + taps <= x.length) for (let k = 0; k < taps; k++) s += h[k] * x[c + k];
    else for (let k = 0; k < taps; k++) { const p = c + k; if (p >= 0 && p < x.length) s += h[k] * x[p]; }
    y[i] = s;
  }
  return { x: y, sr: sr / f };
}

// Candidatos YIN de un cuadro en una banda: mínimos locales de la diferencia normalizada (CMNDF).
function yinCands(B, bi, s, out) {
  const { xs, W, tauMin, tauMax, d, cm, srd, lo, hi } = B;

async function decode(blob, maxSec) {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  const ctx = new Ctx();
  let buf;
  try { buf = await ctx.decodeAudioData(await blob.arrayBuffer()); } finally { if (ctx.close) ctx.close(); }
  const n = Math.min(buf.length, Math.floor(buf.sampleRate * maxSec)), mono = new Float32Array(n);
  for (let c = 0; c < buf.numberOfChannels; c++) { const ch = buf.getChannelData(c); for (let i = 0; i < n; i++) mono[i] += ch[i] / buf.numberOfChannels; }
  return { x: mono, sr: buf.sampleRate };
}

/* Detector de tono ligero para mostrar la nota mientras grabas (YIN). El análisis final es el motor completo.
   Cubre de ~27 Hz (La0) a 5000 Hz (pasa de Do8): antes iba de 45 a 2000 Hz, por eso no salían Do1–Fa1
   y desde Do7 la nota aparecía una octava abajo. Calcula solo hasta encontrar el periodo, así las notas agudas cuestan muy poco. */
function yinLive(buf, sr) {
  let e = 0; for (let i = 0; i < buf.length; i++) e += buf[i] * buf[i];
  if (Math.sqrt(e / buf.length) < 0.008) return null;
  const W = 4096, tMin = Math.max(2, Math.floor(sr / 5000)), tMax = Math.min(Math.floor(sr / 27), buf.length - W - 2);
  const cm = new Float32Array(tMax + 2); let run = 0, best = 0, found = 0;
  for (let t = 1; t <= tMax + 1; t++) {
    let s = 0; for (let i = 0; i < W; i++) { const x = buf[i] - buf[i + t]; s += x * x; } run += s; cm[t] = s * t / (run || 1);
    const p = t - 1;   // p ya tiene vecino a ambos lados
    if (p < tMin) continue;
    if (found) { if (cm[t] < cm[found]) found = t; else break; }          // baja hasta el fondo del valle
    else if (cm[p] < 0.15) found = cm[t] < cm[p] ? t : p;
    if (found && found < t) break;
    if (cm[p] <= cm[p - 1] && cm[p] <= cm[t] && (!best || cm[p] < cm[best])) best = p;
  }
  const k = found || (best && cm[best] < 0.3 ? best : 0);   // respaldo para graves de piano, menos «limpios»
  if (!k || k > tMax) return null;
  const a = cm[k - 1], b = cm[k], c = cm[k + 1], den = a - 2 * b + c;
  return sr / (den > 0 ? k + 0.5 * (a - c) / den : k);
}

function peaksOf(x, n = 240) {
  const out = [], step = Math.max(1, Math.floor(x.length / n)); let mx = 1e-9;

  return out.map(v => Math.sqrt(v / mx));
}

}

  q('.wf').onkeydown = e => { if (e.key === 'ArrowRight') seek((a.currentTime + 1) / t.dur); if (e.key === 'ArrowLeft') seek((a.currentTime - 1) / t.dur); };

async function decodeOnly(blob, maxSec) { return decode(blob, maxSec); }
async function setBlob(id, blob) {
  const st = S[id], sl = SLOTS.find(s => s.id === id);
  const take = { blob, url: URL.createObjectURL(blob), busy: true, pct: 0, res: null, err: null, n: (st.last = (st.last || 0) + 1) };
  st.takes.push(take); st.cur = st.takes.length - 1;
  if (st.takes.length > 8) { const old = st.takes.shift(); URL.revokeObjectURL(old.url); st.cur--; }
  renderSlot(id);
  try {
    const { x, sr } = await decode(blob, sl.max);
    take.x = x; take.sr = sr; take.dur = x.length / sr; take.peaks = peaksOf(x);
    const yieldFn = async p => { take.pct = p; renderSlot(id); await new Promise(r => setTimeout(r, 0)); };
    if (id === 'speech') {
      const frames = await analyzePitch(x, sr, { fmin: 45, fmax: 1000, yield: yieldFn });
      take.res = speechStats(frames);
      if (!take.res) take.err = 'No se detectó voz suficiente. Habla más cerca del micrófono y evita el ruido de fondo.';
    } else {
      take.res = await measureNote(x, sr, sl.kind, { yield: yieldFn });
      if (!take.res) take.err = 'No se detectó una nota clara. Sostén una vocal («a») con volumen constante, sin ruido de fondo.';

}

/* ---- «Ver resultado de otra persona» (oculto, junto a la voz de ejemplo) ----
   Pide a la hoja la lista de quienes hicieron la prueba (acción «listarRangosVocales» del code.gs) y recrea su resultado con
   sus 7 notas. Las columnas se buscan por el texto del encabezado, así no importa su orden en la hoja. No se registra ni se cuenta. */
const NOTA_IDX = { do: 0, re: 2, mi: 4, fa: 5, sol: 7, la: 9, si: 11 };
function notaAMidi(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  const m = String(v).trim().toLowerCase().match(/^(do|re|mi|fa|sol|la|si)\s*([#♯b♭]?)\s*(-?\d+)$/);
  if (!m) { const x = parseFloat(v); return isFinite(x) ? x : null; }
  return 12 * (parseInt(m[3], 10) + 1) + NOTA_IDX[m[1]] + (/[#♯]/.test(m[2]) ? 1 : /[b♭]/.test(m[2]) ? -1 : 0);
}
const normK = k => String(k).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
function campo(row, tests) {   // primer encabezado que cumple todas las pruebas (regex)
  for (const k of Object.keys(row)) { const n = normK(k); if (tests.every(t => t.test(n))) return row[k]; }
  return null;
}
const LOW = /baj|grave/, HIGH = /alt|agud/;
function filaAResultado(row) {
  const nm = campo(row, [/nombre/]), gen = campo(row, [/genero|sexo/]), tes = campo(row, [/tesitura|resultado|tipo/]);
  const midi = (a, b) => notaAMidi(campo(row, [a, b]));
  const R = {
    comf: { low: midi(LOW, /comod/), high: midi(HIGH, /comod/) },
    abs: { low: midi(LOW, /absol/), high: midi(HIGH, /absol/) },
    speech: { avg: midi(/prom|medi/, /habl/), p10: midi(LOW, /habl/), p90: midi(HIGH, /habl/), n: 100, seconds: 15 }
  };
  const need = [R.comf.low, R.comf.high, R.abs.low, R.abs.high, R.speech.avg];
  if (need.some(v => v == null || !isFinite(v))) return null;
  if (R.speech.p10 == null) R.speech.p10 = R.speech.avg - 2;
  if (R.speech.p90 == null) R.speech.p90 = R.speech.avg + 2;
  R.count = 5;
  return { R, nombre: nm ? String(nm) : '', genero: gen ? String(gen) : '', tesitura: tes ? String(tes) : '' };
}

function drawSong(sg, R) {

/* ====== Paso 4 · Passaggio (interfaz) ======
   Vive dentro de la lista 1-2-3 como grupo «pg» (GROUPS). Se desbloquea al pulsar «Listo» en el 3.
   SOLO LOCAL: guardarResultado() NO envía nada del passaggio. Para la base de datos, usar passaggioResult() (objeto plano).
   Reutiliza getMic(), actx, yinLive() (gráfica en vivo), decode(), analyzePitch(), mkPlayer(), peaksOf() y la variable global rec,
   así que «cerrar», «volver» y cancelRec() también paran estas grabaciones. */
const PG_TEXT = {
  'poca-voz': 'Casi no se oyó voz. Acércate al micrófono y haz la sirena con volumen constante.',
  'sin-recorrido': 'La sirena casi no subió. Desliza la voz de forma continua de la nota grave a la aguda.',
  'sin-quiebre': 'No se notó un quiebre claro. Puede que lo hayas suavizado, o que fuera muy sutil. Repite sin esconderlo.'
};
const pgLo = () => PG.R && PG.R.comf.low != null ? PG.R.comf.low : null;
const pgHi = () => PG.R && PG.R.comf.high != null ? PG.R.comf.high : null;

const pgLead = () => `Haz una <b>sirena continua</b> desde <b>${nt(pgLo())}</b> hasta <b>${nt(pgHi())}</b>, deslizando la voz sin pausas (glissando), con una vocal cerrada como <b>«U»</b> o <b>«I»</b>. <b>No intentes ocultar ni suavizar el quiebre</b>: queremos oírlo.`;
function passMount(el, R) {
  PG.R = R || collect(); PG.el = el; PG.takes = [null, null, null]; PG.busy = [false, false, false];
  const lo = pgLo(), hi = pgHi(), box = document.createElement('section'); box.className = 'pg'; box.id = 'pg-root';
  if (lo == null || hi == null || lo >= hi) {
    box.innerHTML = `<p class="warn">Primero completa «Cómodas» (paso 1): necesito tu nota más grave y más aguda para saber desde dónde hasta dónde deslizar.</p>`;
    el.appendChild(box); return box;
  }
  box.innerHTML = `<p class="hint pg-lead">${pgLead()}</p>
    <p class="muted small">Haz 3 intentos. Si uno sale con ruido o te equivocas, repítelo solo.</p>
    <div class="pg-list">${[0, 1, 2].map(i => `<div class="pg-att" id="pg-c${i}">
      <div class="pg-h"><h3>Intento ${i + 1}</h3><span class="pg-st muted small"></span></div>
      <div class="acts"><button class="btn primary rec" type="button" data-pg="rec" data-i="${i}"><span class="dot"></span><span class="lbl">Grabar</span></button>
      <button class="btn" type="button" data-pg="cancel" data-i="${i}" hidden>Cancelar</button></div>
      <canvas class="pg-cv" height="150"></canvas>
      <div class="plh"></div><div class="pg-out" aria-live="polite"></div></div>`).join('')}</div>
    <div class="pg-res" id="pg-res" hidden></div>`;
  box.addEventListener('click', e => {
    const b = e.target.closest('[data-pg]'); if (!b) return;
    const i = +b.dataset.i;
    if (b.dataset.pg === 'rec') { if (rec && rec.id === 'pg' + i) rec.mr.stop(); else pgStart(i); }
    else if (b.dataset.pg === 'cancel') cancelRec();
  });
  el.appendChild(box);
  [0, 1, 2].forEach(i => pgDraw(i));
  return box;
}

// Gráfica: curva de tono contra el tiempo, con las líneas de tu rango cómodo y (si ya hay análisis) el quiebre.
function pgDraw(i, liveSeries, tNow) {
  const cv = document.querySelector(`#pg-c${i} .pg-cv`); if (!cv) return;
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth || 600, H = 150;
  if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  const cs = getComputedStyle(document.documentElement), C = n => cs.getPropertyValue(n).trim();
  const tk = PG.takes[i], res = tk && tk.res, ser = liveSeries || (tk && tk.res ? tk.res.series : null) || [];
  const lo = pgLo(), hi = pgHi();
  let y0 = lo - 4, y1 = hi + 8; ser.forEach(p => { if (p) { if (p.m < y0) y0 = p.m - 1; if (p.m > y1) y1 = p.m + 1; } });
  const L = 38, T = 8, B = 18, X1 = W - 8, Y = m => T + (H - T - B) * (1 - (m - y0) / (y1 - y0));
  const lastT = ser.reduce((a, p) => (p ? p.t : a), 0);
  const tMax = liveSeries ? Math.max(6, (tNow || 0) + 0.5) : Math.max(3, lastT + 0.3), X = t => L + (X1 - L) * t / tMax;
  g.font = '11px Inter,system-ui,sans-serif'; g.textBaseline = 'middle';
  for (let m = Math.ceil(y0); m <= y1; m++) {            // una línea tenue por cada Do (referencia)
    if (((m % 12) + 12) % 12 === 0) { g.strokeStyle = C('--line'); g.lineWidth = 1; g.beginPath(); g.moveTo(L, Y(m)); g.lineTo(X1, Y(m)); g.stroke(); g.fillStyle = C('--muted'); g.textAlign = 'right'; g.fillText(lb(m), L - 5, Y(m)); }
  }
  g.setLineDash([5, 4]); g.strokeStyle = C('--teal'); g.fillStyle = C('--teal');
  [lo, hi].forEach(m => { g.beginPath(); g.moveTo(L, Y(m)); g.lineTo(X1, Y(m)); g.stroke(); g.textAlign = 'right'; g.fillText(lb(m), L - 5, Y(m)); });
  g.setLineDash([]);
  g.strokeStyle = C('--accent'); g.lineWidth = 2.5; g.lineJoin = 'round'; g.beginPath(); let pen = false, lastP = null;
  ser.forEach(p => {
    if (!p) { pen = false; return; }
    const gapBig = lastP && p.t - lastP.t > 0.1; lastP = p;
    if (!pen || gapBig) { g.moveTo(X(p.t), Y(p.m)); pen = true; } else g.lineTo(X(p.t), Y(p.m));
  });
  g.stroke();
  if (res && res.ok) {                                      // marca del quiebre
    const x = X(res.t), y = Y(res.midi);
    g.strokeStyle = C('--warn'); g.lineWidth = 1.5; g.setLineDash([3, 3]); g.beginPath(); g.moveTo(x, T); g.lineTo(x, H - B); g.stroke(); g.setLineDash([]);
    g.fillStyle = C('--warn'); g.beginPath(); g.arc(x, y, 5, 0, 7); g.fill();
    g.textAlign = x > W * 0.7 ? 'right' : 'left'; g.fillText('Quiebre ' + lb(res.midi), x + (x > W * 0.7 ? -9 : 9), Math.max(T + 8, y - 12));
  }
  if (liveSeries && liveSeries.ev) liveSeries.ev.forEach(p => { g.fillStyle = C('--warn'); g.beginPath(); g.arc(X(p.t), Y(p.m), 4, 0, 7); g.fill(); });
}

function pgSetUI(i, on) {
  const c = document.getElementById('pg-c' + i); if (!c) return;
  const b = c.querySelector('[data-pg="rec"]');
  b.classList.toggle('on', on); b.querySelector('.lbl').textContent = on ? 'Detener · 0:00' : (PG.takes[i] ? 'Repetir este intento' : 'Grabar');
  c.querySelector('[data-pg="cancel"]').hidden = !on;
  document.querySelectorAll('#pg-root [data-pg="rec"]').forEach(x => { if (x !== b) x.disabled = on || micBlocked; });
}

async function pgStart(i) {
  if (rec) return;
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder)) { showMicBlocked(); return; }
  let stream; try { stream = await getMic(); } catch (e) { showMicBlocked(); return; }
  stream.getAudioTracks().forEach(t => { t.enabled = true; });
  stopAll();
  const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'].find(m => MediaRecorder.isTypeSupported(m));
  const mr = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
  actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume();
  const an = actx.createAnalyser(); an.fftSize = 8192; const src = actx.createMediaStreamSource(stream); src.connect(an);
  const buf = new Float32Array(an.fftSize), chunks = [], series = [], hist = []; series.ev = [];
  rec = { id: 'pg' + i, mr, t0: Date.now(), cancel: false, hist: [], ext: null };
  mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  mr.onstop = () => {
    const r = rec; clearInterval(r.timer); src.disconnect();
    stream.getAudioTracks().forEach(t => { t.enabled = false; });
    rec = null; pgSetUI(i, false);
    if (r.cancel || !chunks.length) { pgDraw(i); return; }
    pgAnalyze(i, new Blob(chunks, { type: mr.mimeType || 'audio/webm' }));
  };
  mr.start(); pgSetUI(i, true);
  const c = document.getElementById('pg-c' + i), lbl = c.querySelector('[data-pg="rec"] .lbl'), out = c.querySelector('.pg-out');
  out.innerHTML = ''; c.querySelector('.pg-st').textContent = 'Escuchando…';
  rec.timer = setInterval(() => {
    const t = (Date.now() - rec.t0) / 1000; lbl.textContent = `Detener · ${fmtT(t)}`;
    an.getFloatTimeDomainData(buf);
    const f = yinLive(buf, actx.sampleRate);
    if (f) {
      hist.push(hzToMidi(f)); if (hist.length > 3) hist.shift();
      if (hist.length >= 3) {
        const m = median(hist), prev = series.filter(Boolean).slice(-1)[0];
        if (prev && t - prev.t < 0.2 && m - prev.m >= 2.5) series.ev.push({ t, m });   // salto visible en vivo
        series.push({ t, m });
        c.querySelector('.pg-st').innerHTML = `Ahora: <b>${nt(m)}</b>`;
      }
    } else series.push(null);
    pgDraw(i, series, t);
    if (t >= PASS.maxSec) rec.mr.stop();
  }, 45);
}

async function pgAnalyze(i, blob) {
  const c = document.getElementById('pg-c' + i), out = c.querySelector('.pg-out'), st = c.querySelector('.pg-st');
  if (PG.takes[i]) URL.revokeObjectURL(PG.takes[i].url);
  const tk = PG.takes[i] = { blob, url: URL.createObjectURL(blob), res: null };
  PG.busy[i] = true; out.innerHTML = '<span class="muted">Analizando…</span>'; st.textContent = '';
  try {
    const { x, sr } = await decode(blob, PASS.maxSec);
    tk.x = x; tk.sr = sr; tk.dur = x.length / sr; tk.peaks = peaksOf(x);
    const fr = await analyzePitch(x, sr, { hop: PASS.hop, fmin: Math.max(30, midiToHz(pgLo() - 7)), fmax: midiToHz(pgHi() + 14),
      yield: async p => { out.innerHTML = `<span class="muted">Analizando… ${Math.round(p * 100)}%</span>`; await new Promise(r => setTimeout(r, 0)); } });
    tk.res = detectPassaggio(fr, x, sr);
  } catch (e) { tk.res = { ok: false, reason: 'error', series: [], flags: [] }; }
  PG.busy[i] = false;
  const plh = c.querySelector('.plh'); plh.innerHTML = ''; if (tk.peaks) plh.appendChild(mkPlayer(tk, () => 'rango-vocal_passaggio_intento' + (i + 1)));
  pgSetUI(i, false); pgDraw(i); pgRenderAttempt(i); pgRenderResult();
}

function pgRenderAttempt(i) {
  const c = document.getElementById('pg-c' + i), out = c.querySelector('.pg-out'), st = c.querySelector('.pg-st'), r = PG.takes[i].res;
  if (!r.ok) { st.textContent = 'Sin quiebre'; out.innerHTML = `<p class="err">${PG_TEXT[r.reason] || 'No se pudo leer este audio. Repite el intento.'}</p>`; return; }
  st.innerHTML = `Quiebre en <b>${nt(r.midi)}</b>`;
  const how = r.kind === 'salto' ? `salto de ${r.jump.toFixed(1)} semitonos` : 'pausa breve y reanudación más aguda';
  out.innerHTML = `<p class="pg-line">Justo antes del quiebre: <b>${ntBig(r.midi)}</b></p><p class="muted small">Detectado por ${how}${r.flags.length ? ' · ' + r.flags.join(' · ') : ''} · confianza ${r.conf}</p>`;
}

function passaggioResult() {   // objeto plano para guardarlo más adelante (Excel); null si aún no hay datos
  const sum = passaggioSummary(PG.takes.map(t => t && t.res)); if (!sum) return null;
  const chk = passaggioCheck(collect(), sum), n = noteInfo(sum.midi);
  return { midi: sum.midi, en: n.en, es: n.es, hz: Math.round(n.hz * 10) / 10, confianza: sum.conf, validos: sum.valid, usados: sum.used, dispersion: +sum.spread.toFixed(2),
    intentos: PG.takes.map(t => (t && t.res && t.res.ok ? +t.res.midi.toFixed(2) : null)), tipo: chk.type.es, esperado: PASS_EXPECT[chk.type.id][0], estado: chk.status, enRangoComodo: chk.inComf };
}
function pgResultHtml() {   // dentro del Paso 4: tu nota + de qué intentos salió (el detalle de intentos va solo aquí)
  const sum = passaggioSummary(PG.takes.map(t => t && t.res)); if (!sum) return '';
  let warns = '';
  if (sum.dropped) warns += `<p class="warn">Descarté ${sum.dropped} intento${sum.dropped > 1 ? 's' : ''} por quedar muy lejos de los demás.</p>`;
  if (sum.valid < 2) warns += `<p class="warn">Con un solo intento válido el resultado es poco fiable. Graba al menos uno más.</p>`;
  else if (sum.conf === 'baja') warns += `<p class="warn">Los intentos no coinciden entre sí. Repite el que salió distinto.</p>`;
  return `<h3>Tu passaggio</h3><div class="note">${ntBig(sum.midi)}</div>
    <p class="muted small">Sale de ${sum.used} intento${sum.used > 1 ? 's' : ''}: ${sum.all.map(v => lb(v)).join(' · ')}</p>${warns}`;
}
function pgFinalHtml() {   // pantalla de resultados: solo lo importante, sin intentos ni tarjetas
  if (replay) return '';
  const sum = passaggioSummary(PG.takes.map(t => t && t.res)); if (!sum) return '';
  const chk = passaggioCheck(collect(), sum), E = chk.expected, name = chk.type.es, rng = `${lb(E[1])} – ${lb(E[2])}`;
  const msg = { coincide: `Es lo normal para tu tipo de voz (${name}): suele estar entre ${rng}.`,
    cercano: `Está un poco más ${chk.diff > 0 ? 'arriba' : 'abajo'} de lo habitual para ${name} (${rng}). Es normal, cambia con la técnica y la vocal.`,
    distinto: `Está más ${chk.diff > 0 ? 'agudo' : 'grave'} de lo habitual para ${name} (${rng}).` }[chk.status];
  return `<div class="sec"><h2>Tu passaggio</h2><div class="note">${ntBig(sum.midi)}</div>
    <p class="lead2">${msg}</p>
    <p class="muted small" style="margin-top:8px">Es la nota donde tu voz cambia de pecho a cabeza. Evita forzar el volumen justo antes de ella y practica pasarla suave, con sirenas.</p></div>`;
}
function pgRenderResult() {
  const box = document.getElementById('pg-res'); if (box) { const html = pgResultHtml(); box.hidden = !html; box.innerHTML = html; }
  pgHeadNote();
}
/* ---- Conexión con la app (solo local: no guarda nada en la base de datos) ---- */
function pgEnter() {   // al abrir el paso: monta, o conserva los intentos si el rango cómodo no cambió
  const host = document.getElementById('pgHost'); if (!host || !pgUnlocked()) return;
  const R = collect(), key = R.comf.low + '|' + R.comf.high;
  if (PG.key === key && host.firstChild) return;
  pgReset(); host.innerHTML = ''; PG.key = key; passMount(host, R);
}
function pgReset() {
  if (rec && rec.id && rec.id.startsWith('pg')) cancelRec();
  PG.takes.forEach(t => { if (t && t.url) URL.revokeObjectURL(t.url); });
  PG.takes = [null, null, null]; PG.key = null; PG.R = null;
  const host = document.getElementById('pgHost'); if (host) host.innerHTML = '';
  pgHeadNote();
}
function pgHeadNote() {   // texto a la derecha del título cuando el 4 está cerrado
  const el = document.getElementById('grp-pg'); if (!el) return;
  const sum = PG.takes.some(t => t && t.res) ? passaggioSummary(PG.takes.map(t => t && t.res)) : null;
  el.querySelector('.hs').textContent = el.classList.contains('locked') ? '' : (sum ? lb(sum.midi) : '');
}
function syncLocks() {   // bloquea/desbloquea los pasos 2, 3 y 4 según el avance
  GROUPS.forEach(g => {
    if (g.n === 1) return;
    const el = document.getElementById('grp-' + g.id); if (!el) return;
    const locked = !groupUnlocked(g); el.classList.toggle('locked', locked); el.querySelector('.ghead').setAttribute('aria-disabled', locked);
    if (locked) { if (el.hasAttribute('data-open')) setOpen(g.id, false); if (g.special) pgReset(); }
    else if (g.special && el.hasAttribute('data-open')) pgEnter();   // si cambió el rango cómodo, se reinician los intentos
  });
  pgHeadNote();
}
function pgRefresh() {   // cambio de notación C D E ↔ Do Re Mi
  if (!PG.R || !document.getElementById('pg-root')) return;
  const lead = document.querySelector('#pg-root .pg-lead'); if (lead && pgLo() != null) lead.innerHTML = pgLead();
  [0, 1, 2].forEach(i => { pgDraw(i); if (PG.takes[i] && PG.takes[i].res) pgRenderAttempt(i); });
  pgRenderResult();
}
/*PASSAGGIO-UI-END*/

</script>
</body></html>
